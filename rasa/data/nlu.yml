version: "3.1"
nlu:
- intent: greet
  examples: |
    - hi
    - hii
    - namaste
    
    - hello
    - hey
    - hey there
    - good morning
    - good evening

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you
    - talk to you later
    - i'm off

- intent: affirm
  examples: |
    - yes
    - sure
    - okay
    - yep
    - sounds good

- intent: deny
  examples: |
    - no
    - nope
    - not now
    - don't

- intent: upload_file
  examples: |
    - I uploaded a file
    - I have a csv
    - I uploaded dataset.csv
    - here's my file
    - I added an excel file
    - uploaded data.xlsx
    - I want to upload a file
    - I will upload a CSV

- intent: ask_summary
  examples: |
    - summarize dataset
    - give me a summary
    - show dataset summary
    - dataset stats
    - tell me column stats

- intent: ask_charts
  examples: |
    - what charts can I make?
    - suggest chart types
    - show me charts
    - which charts are available

- intent: request_chart
  examples: |
    - show me a bar chart of [sales](column) over [month](column)
    - plot [revenue](column) vs [cost](column)
    - line chart of [temperature](column) by [date](column)
    - make a scatter plot of [x](column) and [y](column)
    - histogram of [age](column)
    - create a pie chart for [category](column)

- intent: specify_columns
  examples: |
    - use columns [sales](column) and [date](column)
    - select [revenue](column)
    - columns [x](column), [y](column)

- intent: choose_chart
  examples: |
    - bar
    - line
    - scatter
    - histogram
    - pie
    - bar chart
    - line chart

- intent: ask_help
  examples: |
    - help
    - what can you do
    - how to use this

- intent: cancel
  examples: |
    - cancel
    - start over
    - forget it


