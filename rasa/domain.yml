version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge

entities: []

slots:
  session_started_metadata:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "Hey! How are you?"
  utter_cheer_up:
    - text: "Here is something to cheer you up:"
  utter_did_that_help:
    - text: "Did that help you?"
  utter_happy:
    - text: "Great, carry on!"
  utter_goodbye:
    - text: "Bye!"
  utter_iamabot:
    - text: "I am a bot, powered by Rasa."
  utter_default:
    - text: "I'm not sure how to respond to that."

session_config:
  session_expiration_time: 60  # minutes
  carry_over_slots_to_new_session: true
