version: "3.1"

intents:
  - greet
  - mood_great
  - mood_unhappy
  - affirm
  - deny
  - goodbye
  - bot_challenge

responses:
  utter_greet:
    - text: "Hello! How can I help you today?"

  utter_mood_great:
    - text: "That's awesome! 😃"

  utter_mood_unhappy:
    - text: "I'm sorry to hear that. Do you want to talk about it?"

  utter_goodbye:
    - text: "Goodbye! Take care 👋"

  utter_iamabot:
    - text: "I am a bot, powered by Rasa."

# remove duplicate slot definitions
slots: {}

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
