version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - upload_file
  - uploaded_file
  - ask_summary
  - ask_charts
  - dataset_query
  - ask_help
  - quit
  - bot_challenge
  - nlu_fallback
  - trigger_mdl_processing 

# Entities (none required for routing; backend will parse dataset specifics)
entities: []

# Slots (do not influence conversation directly for most; set/cleared by actions)
slots:
  uploaded_file:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  file_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  mdl:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  last_sql:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  last_query:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  table_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text


# Responses (utterances)
responses:
  utter_greet:
    - text: "Hi! You can upload a CSV/Excel file to get insights and charts. Need help?"

  utter_ask_upload:
    - text: "Sure — please upload your CSV or Excel file (or provide a public link)."

  utter_after_upload:
    - text: "Got it — file received. You can now ask questions about the dataset."

  utter_ask_chart_type:
    - text: "Which chart type would you like? (bar / line / scatter / histogram / pie)"

  utter_no_file:
    - text: "I don't see a dataset yet. Please upload a CSV or Excel file first."

  utter_chart_generated:
    - text: "Done — Generated the chart and insights."

  utter_help:
    - text: "I can generate charts and insights from your uploaded dataset. Upload a file and then ask a question (e.g., 'show sales by month')."

  utter_goodbye:
    - text: "Goodbye! Upload a new file anytime for more analysis."

  utter_default:
    - text: "Sorry, I didn't understand. Try asking something like 'upload file', 'show me a chart'."

  utter_iamabot:
    - text: "I am a bot helping you create charts and insights from your dataset."

# Forms (none in this design; backend handles dataset-specific prompts)
forms: {}

# Custom actions (these must be implemented in your actions server)
actions:
  - action_handle_file_upload
  - action_receive_mdl
  - action_send_sql_to_client
  - action_receive_table
  - action_generate_chart
  - action_clear_session
  - action_process_mdl

session_config:
  session_expiration_time: 3600
  carry_over_slots_to_new_session: true
