services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agent_marketplace
      - DB_USER=postgres
      - DB_PASSWORD=654645
      - RASA_SERVER_URL=http://rasa:5005
    depends_on:
      postgres:
        condition: service_healthy


  rasa:
    build: 
      context: ./rasa
      dockerfile: Dockerfile
    user: "1001"
    volumes:
      - ./rasa:/app
      - ./rasa/models:/app/models
    working_dir: /app
    # Start Rasa in API mode with CORS enabled
    command: ["run", "--enable-api", "--cors", "*", "--debug", "--endpoints", "endpoints.yml", "--port", "5005"]
    ports:
      - "5005:5005"
    environment:
      - RASA_ENVIRONMENT=${RASA_ENV:-development}
      - RASA_ACTIONS_URL=http://actions:5055/webhook
      - RASA_ACTIONS_HOST=0.0.0.0
      - RASA_ACTIONS_PORT=5055
      - RASA_LOCAL_PATH=/app
      - RASA_DOMAIN=/app/domain.yml
      - RASA_DATA=/app/data
      - RASA_MODELS=/app/models
      - RASA_TRAINING_DATA=/app/data
    depends_on:
      actions:
        condition: service_started

  actions:
    build:
      context: ./rasa
      dockerfile: Dockerfile
    user: "1001"
    command: ["run", "actions", "--port", "5055"]  # This starts the actions server
    ports:
      - "5055:5055"
    volumes:
      - ./rasa/actions:/app/actions
    environment:
      - RASA_ACTIONS_HOST=0.0.0.0
      - RASA_ACTIONS_PORT=5055

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: agent_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 654645
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  rasa_data:
