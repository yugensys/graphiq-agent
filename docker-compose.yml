version: "3.9"

services:
  agent-marketplace-backend:
    build: .  # Assumes Dockerfile is in root
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agent_marketplace
      - DB_USER=postgres
      - DB_PASSWORD=654645
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: agent_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 654645
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
